<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>India Trust &amp; Safety – Business Plan 2027</title>
<style>
:root{--bg:#F6F8F6;--card:#fff;--ink:#0F1B2D;--mut:#4A5A70;--grn:#1F6B3A;--hdtx:#fff;--soft:#EEF3EF;--tot:#E1EDE5;--line:#CBD5CF;--hl:#FFE9B8;--hltx:#5A3A00;--c1:#12806C;--c2:#0F1B2D;--c3:#E0A04A;--c4:#5B6B82;--c5:#9AA6B8;--c1t:#fff;--c2t:#fff;--c3t:#0F1B2D;--c4t:#fff;--c5t:#0F1B2D;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1512;--card:#17211B;--ink:#EAF1EC;--mut:#A9B8AE;--grn:#6CCB93;--soft:#1E2B23;--tot:#22352A;--line:#34463B;--hl:#5A4410;--hltx:#FFE9B8;--c2:#CFE0D5;--c2t:#0F1B2D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1512;--card:#17211B;--ink:#EAF1EC;--mut:#A9B8AE;--grn:#6CCB93;--soft:#1E2B23;--tot:#22352A;--line:#34463B;--hl:#5A4410;--hltx:#FFE9B8;--c2:#CFE0D5;--c2t:#0F1B2D;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0 0 6px}
h2{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tab{font:inherit;font-weight:600;padding:10px 16px;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--grn);color:var(--hdtx);border-color:var(--grn)}
:root[data-theme="dark"] .tab[aria-selected="true"],:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#0E1512}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
.bar{display:flex;height:72px;border-radius:10px;overflow:hidden}
.seg{border:0;font:inherit;font-weight:700;font-size:20px;cursor:pointer;min-width:34px;padding:0 4px;transition:flex-grow .25s}
.seg:hover{filter:brightness(1.1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;color:var(--mut);font-size:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.ed label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mut)}
.ed input{font:inherit;font-size:18px;font-weight:600;padding:8px 10px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.tot{display:inline-block;padding:6px 12px;border-radius:999px;font-weight:700;background:var(--tot);color:var(--grn)}
.tot.bad{background:var(--hl);color:var(--hltx)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;padding:8px 14px;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.kpi{background:var(--soft);border-radius:10px;padding:16px}
.kpi b{display:block;font-size:28px;color:var(--grn);line-height:1.15}
.kpi span{font-size:14px;color:var(--mut)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:15px}
th{background:var(--grn);color:var(--hdtx);text-align:left;padding:11px 12px;font-weight:600}
:root[data-theme="dark"] th,:root:not([data-theme="light"]) th{color:#0E1512}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle;background:var(--card)}
td.ar{background:var(--soft);font-weight:600;width:170px}
td.w{width:130px;font-weight:700;color:var(--grn)}
.wb{height:6px;border-radius:3px;background:var(--grn);margin-top:5px;opacity:.55}
tr.t td{background:var(--tot);font-weight:700}
.hl .ph{background:var(--hl);color:var(--hltx);border-radius:4px;padding:0 4px}
.note{color:var(--mut);font-size:14px;margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
<h1>Business Plan 2027: India Trust &amp; Safety</h1>
<p class="sub">KPI framework: local team, less HQ dependency, AI-enabled efficiency. First version, weights are proposed.</p>
<div class="row" style="margin:0"><label style="display:flex;gap:8px;align-items:center;min-height:44px"><input type="checkbox" id="hlt"> Highlight open items <span id="oc" class="tot bad"></span></label></div>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="view"></div>
</div>
<script>
var P=[["AIGC Operations",40,"c1","aigc"],["Public Opinion & Risk Intelligence",30,"c2","opinion"],["Policy Localization",20,"c3","policy"],["Moderation baseline",5,"c4","policy"],["Team & Governance",5,"c5","policy"]];
var W=P.map(function(p){return p[1]});
var TABS=[["overview","Overview"],["aigc","AIGC Operations"],["opinion","Public Opinion & Risk"],["policy","Policy, Moderation, Team"],["ai","AI & Automation"],["leader","Team Leader"]];
var A=["Area","KPI","Weight","Logic","2027 target"];
var D={
aigc:{t:"AIGC Operations KPI: 40% of plan",s:"AIGC risk and operations 25% plus machine review 15%, with competitor research. KPI weights sum to 100%.",c:A,g:[
["AIGC Risk & Operations",[["New business review and approval",20,"Local approval gate before any new AIGC business goes live, with spot-check configuration","100% reviewed before launch"],["Thresholds and safe assets",10,"Metric monitoring, threshold tuning, word bank and question bank updates owned locally","Updated monthly, no HQ wait"],["Local culture and language risk base",15,"Regional knowledge base built, iterated and self-assessed","Quarterly review done"]]],
["Machine Review",[["Machine review coverage",20,"Every business covered by machine review, with strategy set at access","100% coverage"],["Strategy optimization",15,"Strategy tuned using local regulation, competitors and business exposure","Reviewed every month"],["Firewall capability",10,"Gaps found through QA, leak analysis and simulated attacks, then fixed","[__] attack tests per quarter"]]],
["Competitor Research",[["AIGC standards benchmark",10,"Compare competitors’ AIGC review standards and move our rules where gaps exist","1 report per quarter"]]]],o:"Outcome KPI: zero P0 AIGC risk incident"},
opinion:{t:"Public Opinion & Risk Intelligence KPI: 30% of plan",s:"Public opinion 15% plus risk inspection 15%. KPI weights sum to 100%.",c:A,g:[
["Public Opinion & Early Warning",[["P0 response time",25,"P0 public opinion feedback within the time limit","Under 24h in 2026, now [__h]"],["Early-warning hit rate",20,"Risks flagged before they escalate, with response plan ready","[__]% flagged early"],["Source coverage",10,"Effective feedback from channels beyond Meltwater","[__] added channels"]]],
["Risk Inspection",[["Local risk radar",15,"Monthly scan of market trends, industry shifts and competitor moves, each risk with owner and deadline","12 radars, 100% actions assigned"],["Risks found outside rules",10,"Valid risks discovered beyond current policy and submitted in full","[__] per quarter"]]],
["Competitor & Geopolitical Research",[["Geopolitical watch",10,"India-specific geopolitical risks tracked with action plans","Monthly report"],["Competitor response benchmark",10,"How competitors handle public opinion and geopolitical events, used to improve our plans","1 report per quarter"]]]],o:"Outcome KPI: zero unplanned P0 public opinion event"},
policy:{t:"Policy 20%, Moderation 5%, Team 5%",s:"Policy is raised because HQ wants more local rule ownership. Moderation is held at baseline.",c:A,g:[
["Policy Localization (20%)",[["Regulatory perception",30,"Local regulation changes captured, including IT Rules 2021, DPDP and POCSO","Zero missed updates"],["Rule translation and rollout",30,"Rules written from regulation and risk information, then rolled out","Rolled out within [__] days"],["Local ruling of difficult cases",25,"Audit and QA disputes decided in India, HQ informed","[__]% decided locally"],["Training pass rate",15,"Pass rate of qualified employees","[__]%"]]],
["Moderation baseline (5%)",[["Accuracy",35,"Moderation accuracy rate","99.5%"],["Redline leakage",35,"No redline case missed across UGC, PGC, AIGC and Apps","0"],["Same-day clearance",30,"All data cleared the same day","100% (2026: 24h UGC, 36h others)"]]],
["Team & Governance (5%)",[["Team structure",50,"361 structure: 30% core, 60% mid-level, 10% to be promoted","Maintained"],["AI and automation skills",50,"Team trained to run and improve automated workflows","[__]% trained"]]]]},
leader:{t:"Team Leader KPI",s:"Weights are proposed and sum to 100%.",c:["KPI","Weight","Logic","2027 target"],f:[
["Local risk ownership",35,"Risk decisions made locally, HQ informed, not approved case by case","[__]% of decisions made locally"],["Risk identification and solutions",25,"Market trends, industry shifts and competitor moves turned into actions on time","100% of risks with owner and deadline"],["AI and automation delivery",25,"Automation workstreams delivered on schedule","+15% efficiency, 1.5 headcount saved"],["Team structure",15,"Maintain the 361 structure (30% core, 60% mid-level, 10% to be promoted) and AI skills","361 maintained, training plan done"]]}};
var AI={c:["Workstream","Scope","Baseline (Q1)","Target","Timeline"],r:[["QA & user-report automation","Automated quality checks, root-cause analysis and handling of user reports","[__] manual hours per month","[__]% hours saved","Pilot Q2, scale Q3"],["Public opinion sample testing","Sample testing moved to cloud automation","[__] manual hours per month","[__]% hours saved","First tests Q2, live Q3"],["Report automation","All recurring reports generated automatically, including monthly achievement data","[__] manual hours per month","100% of reports automated","Pilot Q2, full Q4"]],t:["Overall","Efficiency gain across the team","Baseline set in Q1","+15% efficiency, 1.5 headcount saved","Confirmed Q4"],m:[["Q1","Baseline manual hours, choose tools, set up cloud environment","Baseline signed off"],["Q2","Pilot QA and report automation, first cloud sample tests","Hours saved in pilots"],["Q3","Scale all three workstreams, move freed capacity to policy and risk work","Share of target reached"],["Q4","Full automation live, confirm results","+15% efficiency, 1.5 headcount"]]};
function e(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/__\]/g,"__]")}
function ph(s){s=e(s);return s.replace(/(\[__[^]]*\](?:%|h)?)/g,'<span class="ph">$1</span>')}
function wc(n){return '<td class="w">'+n+'%<div class="wb" style="width:'+n+'%"></div></td>'}
function th(c){return "<tr>"+c.map(function(x){return "<th>"+e(x)+"</th>"}).join("")+"</tr>"}
function tw(h){return '<div class="tw"><table>'+h+"</table></div>"}
function gtab(d){var h=th(d.c);d.g.forEach(function(g){g[1].forEach(function(r,i){h+="<tr>"+(i?"":'<td class="ar" rowspan="'+g[1].length+'">'+e(g[0])+"</td>")+"<td>"+e(r[0])+"</td>"+wc(r[1])+"<td>"+ph(r[2])+"</td><td>"+ph(r[3])+"</td></tr>"})});if(d.o)h+='<tr class="t"><td colspan="2">Total</td><td class="w">100%</td><td colspan="2">'+e(d.o)+"</td></tr>";return tw(h)}
function ftab(d){var h=th(d.c);d.f.forEach(function(r){h+="<tr><td class='ar'>"+e(r[0])+"</td>"+wc(r[1])+"<td>"+ph(r[2])+"</td><td>"+ph(r[3])+"</td></tr>"});return tw(h)}
function head(t,s){return "<h2>"+e(t)+'</h2><p class="sub">'+e(s)+"</p>"}
function total(){return W.reduce(function(a,b){return a+b},0)}
function seg(){var tt=total()||1;document.getElementById("bar").innerHTML=P.map(function(p,i){return '<button class="seg" style="flex-grow:'+W[i]+';background:var(--'+p[2]+');color:var(--'+p[2]+'t)" title="'+e(p[0])+": "+W[i]+'%" data-go="'+p[3]+'">'+(W[i]/tt>0.08?W[i]+"%":"")+"</button>"}).join("");var t=document.getElementById("tt");t.textContent="Total "+total()+"%"+(total()===100?"":" (needs 100%)");t.className="tot"+(total()===100?"":" bad")}
function overview(){var l=P.map(function(p,i){return '<span><i style="background:var(--'+p[2]+')"></i>'+e(p[0])+" "+W[i]+"%</span>"}).join("");
var inp=P.map(function(p,i){return '<label>'+e(p[0])+'<input type="number" min="0" max="100" value="'+W[i]+'" data-i="'+i+'"></label>'}).join("");
return head("Where the effort goes","Click a block to open its KPI table. Change the numbers to test a different split.")+'<div class="card"><div class="bar" id="bar"></div><div class="legend" id="lg">'+l+'</div><div class="ed">'+inp+'</div><div class="row"><span class="tot" id="tt"></span><button class="btn" id="rs">Reset to proposed</button></div><p class="note">Proposed split is 40 / 30 / 20 / 5 / 5. AI and automation runs across all pillars.</p></div>'+
'<h2>2027 targets vs 2026</h2><div class="kpis" style="margin-top:12px"><div class="kpi"><span>Team efficiency</span><b>+15%</b><span>Equal to 1.5 headcount saved</span></div><div class="kpi"><span>Moderation timeliness</span><b>Same day</b><span>2026: 24h UGC, 36h others</span></div><div class="kpi"><span>Quality</span><b>99.5% · 0</b><span>Accuracy held, zero redline leakage</span></div><div class="kpi"><span>P0 opinion response</span><b><span class="ph">[__h]</span></b><span>2026: under 24h</span></div></div>'}
function render(id){var v=document.getElementById("view"),h="";
if(id==="overview")h=overview();
else if(id==="ai")h=head("AI & Automation KPI: all pillars","Target: overall team efficiency up 15%, equal to 1.5 headcount saved. Manual hours are filled in after the Q1 baseline.")+tw(th(AI.c)+AI.r.map(function(r){return "<tr><td class='ar'>"+e(r[0])+"</td>"+r.slice(1).map(function(c){return "<td>"+ph(c)+"</td>"}).join("")+"</tr>"}).join("")+'<tr class="t">'+AI.t.map(function(c){return "<td>"+e(c)+"</td>"}).join("")+"</tr>")+"<h2 style='margin-top:24px'>Quarterly milestones</h2>"+tw(th(["Quarter","Milestone","Measure"])+AI.m.map(function(r){return "<tr><td class='ar'>"+r[0]+"</td><td>"+e(r[1])+"</td><td>"+e(r[2])+"</td></tr>"}).join(""));
else{var d=D[id];h=head(d.t,d.s)+(d.f?ftab(d):gtab(d))}
v.innerHTML=h;if(id==="overview")seg();count()}
function count(){var n=(document.getElementById("view").innerHTML+"").split("[__").length-1;var all=JSON.stringify([D,AI]).split("[__").length-1;document.getElementById("oc").textContent=all+" open items"}
function go(id){if(!TABS.some(function(t){return t[0]===id}))id="overview";document.querySelectorAll(".tab").forEach(function(b){b.setAttribute("aria-selected",b.dataset.id===id)});render(id);if(location.hash!=="#"+id)history.replaceState(null,"","#"+id)}
document.getElementById("tabs").innerHTML=TABS.map(function(t){return '<button class="tab" role="tab" data-id="'+t[0]+'">'+e(t[1])+"</button>"}).join("");
document.addEventListener("click",function(ev){var t=ev.target.closest(".tab,[data-go]");if(t)go(t.dataset.id||t.dataset.go);if(ev.target.id==="rs"){W=P.map(function(p){return p[1]});go("overview")}});
document.addEventListener("input",function(ev){var t=ev.target;if(t.dataset.i!==undefined){W[+t.dataset.i]=Math.max(0,Math.min(100,+t.value||0));seg();document.getElementById("lg").innerHTML=P.map(function(p,i){return '<span><i style="background:var(--'+p[2]+')"></i>'+e(p[0])+" "+W[i]+"%</span>"}).join("")}if(t.id==="hlt")document.body.classList.toggle("hl",t.checked)});
window.addEventListener("hashchange",function(){go(location.hash.slice(1))});
go(location.hash.slice(1)||"overview");
</script>
</body>
</html>
